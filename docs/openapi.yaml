openapi: 3.1.0
info:
  title: KDE Connect Cloud Relay
  version: 0.1.0
  description: >-
    Experimental V1 live opaque relay. RELAY_SERVER_NAME is mandatory and must
    match the server leaf DNS SAN. Both CA modes require the server certificate
    and key. TLS SNI must match the configured domain. Every HTTP route requires
    exactly one matching Host (case-insensitive, optional numeric port 1..65535).
    Absolute-URI authority is checked too; forwarding headers have no authority.
    Malformed/missing/duplicate Host returns 400 invalid_host; a valid other
    hostname returns 421 misdirected_request. WebSocket framing is in protocol.md.
servers:
  - url: https://localhost:8443
security:
  - clientCertificate: []
paths:
  /v1/info:
    get:
      operationId: getInfo
      security: []
      responses:
        '200':
          description: Public versions and non-tenant limits
          content:
            application/json:
              schema:
                type: object
                required: [protocolVersions, webSocketSubprotocol, experimental, limits, capabilities]
                properties:
                  protocolVersions: {type: array, items: {type: integer, const: 1}}
                  webSocketSubprotocol: {type: string, const: kdeconnect-relay.v1}
                  experimental: {type: boolean, const: true}
                  limits: {type: object, additionalProperties: {type: integer}}
                  capabilities: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/Invalid'}
        '421': {$ref: '#/components/responses/Misdirected'}
  /v1/devices:
    get:
      operationId: listDevices
      parameters:
        - name: after
          in: query
          schema: {type: string, format: uuid}
          description: Exclusive registration UUID cursor, scoped by the authenticated account
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      responses:
        '200':
          description: Active account registrations, including the caller; presence is a hint
          content:
            application/json:
              schema:
                type: object
                required: [devices, nextCursor]
                properties:
                  devices:
                    type: array
                    items: {$ref: '#/components/schemas/Device'}
                  nextCursor: {type: [string, 'null'], format: uuid}
        '400': {$ref: '#/components/responses/Invalid'}
        '421': {$ref: '#/components/responses/Misdirected'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Denied'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/devices/me:
    patch:
      operationId: updateDisplayName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: At most 128 UTF-8 bytes, non-whitespace and without control characters
      responses:
        '200':
          description: Display name updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: {type: boolean, const: true}
        '400': {$ref: '#/components/responses/Invalid'}
        '421': {$ref: '#/components/responses/Misdirected'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Denied'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: revokeSelf
      description: Revokes the registration and all its certificates. Repeat DELETE is allowed only for an already-revoked registration; a revoked renewal credential cannot revoke an active device.
      responses:
        '204': {description: Registration revoked and active streams fenced}
        '400': {$ref: '#/components/responses/Invalid'}
        '421': {$ref: '#/components/responses/Misdirected'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Denied'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/tunnel:
    get:
      operationId: openTunnel
      description: HTTP/1.1 WebSocket upgrade with native certificate authentication. No compression. See protocol.md for controls, binary framing, credits, close semantics, and limits.
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema: {type: string, const: kdeconnect-relay.v1}
      responses:
        '101':
          description: WebSocket accepted; registration rechecked before installing connection generation
          headers:
            Sec-WebSocket-Protocol:
              schema: {type: string, const: kdeconnect-relay.v1}
        '400': {$ref: '#/components/responses/Invalid'}
        '421': {$ref: '#/components/responses/Misdirected'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Denied'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        '200':
          description: Process responds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '400': {$ref: '#/components/responses/Invalid'}
        '421': {$ref: '#/components/responses/Misdirected'}
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          description: Authorization metadata available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '400': {$ref: '#/components/responses/Invalid'}
        '421': {$ref: '#/components/responses/Misdirected'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    clientCertificate:
      type: mutualTLS
      description: Valid clientAuth leaf plus complete intermediates, trusted by the selected CA mode, and actively registered SHA-256 leaf fingerprint. Certificate subjects and forwarded headers confer no access.
  schemas:
    Device:
      type: object
      required: [id, kdeDeviceId, displayName, online]
      properties:
        id: {type: string, format: uuid}
        kdeDeviceId: {type: string}
        displayName: {type: string}
        online: {type: boolean}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [live, ready]}
    Error:
      type: object
      required: [code, message, requestId]
      additionalProperties: false
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string, format: uuid}
      example:
        code: identity_denied
        message: Client identity denied
        requestId: 3d6f15cf-5c52-4520-9c2d-c9742b007a39
  responses:
    Invalid:
      description: Malformed/bounded input, including invalid_host for missing, duplicate or malformed Host
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Misdirected:
      description: Valid Host or absolute-URI hostname differs from configured relay domain
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: misdirected_request
            message: Request hostname does not match relay domain
            requestId: 3d6f15cf-5c52-4520-9c2d-c9742b007a39
    Unauthenticated:
      description: Missing usable registered-client identity
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Denied:
      description: Unregistered, disabled, revoked, or inaccessible identity
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Authorization dependency unavailable; fail closed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
